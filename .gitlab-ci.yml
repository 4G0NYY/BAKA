# GitLab CI/CD. This is where releases come from. The one exception is winget, which
# only takes pull requests from a GitHub account: .github/workflows/winget.yml runs on
# the mirrored tag and submits the archives this pipeline built.

stages:
  - check
  - test
  - build
  - release
  - publish

variables:
  CARGO_TERM_COLOR: always

default:
  tags: [docker]
  # Only target/ is cached. CARGO_HOME deliberately stays at its default outside the
  # workspace: pulling the registry into $CI_PROJECT_DIR (the usual trick for caching
  # it) puts thousands of vendored crates under the checkout, and scripts/no-em-dashes.sh
  # scans the working tree, so the check then fails on dashes in vendored changelogs.
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - target/

# ---------------------------------------------------------------- ci.yml ----
# GitHub ran these on push to main and on every pull request; the GitLab
# equivalent is the default branch plus merge request pipelines.
.ci_rules:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

check:
  extends: .ci_rules
  stage: check
  image: rust:latest
  before_script:
    - rustup component add rustfmt clippy
    # The manifest check renders JSON through python3, which the rust image lacks.
    - apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*
  script:
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - echo "No em dashes"
    - bash scripts/no-em-dashes.sh
    - echo "The release manifests still render"
    # A block scalar, because these lines contain ": " and YAML would otherwise
    # read them as mapping keys.
    - |
      bash scripts/manifests.sh 9.9.9 abc123 def456 fee789 rendered
      python3 -m json.tool rendered/baka.json > /dev/null
      grep -q '"version": "9.9.9"' rendered/baka.json
      grep -q '^pkgver=9.9.9$' rendered/aur/PKGBUILD
      # A PKGBUILD is a bash script, and makepkg is not here to say so.
      bash -n rendered/aur/PKGBUILD

test:linux:
  extends: .ci_rules
  stage: test
  image: rust:latest
  script:
    - cargo test

# The other half of the GitHub `test` matrix (windows-latest).
test:windows:
  extends: .ci_rules
  stage: test
  tags: [windows]
  cache: []
  script:
    - cargo test

msrv:
  extends: .ci_rules
  stage: check
  image: rust:1.88.0
  script:
    - cargo check

# ----------------------------------------------------------- release.yml ----
# Tag-driven: `git push origin vX.Y.Z`.
.release_rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

version:
  extends: .release_rules
  stage: build
  image: rust:latest
  cache: []
  script:
    - echo "The tag and Cargo.toml agree"
    - |
      number=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
      if [ "v$number" != "$CI_COMMIT_TAG" ]; then
        echo "tag $CI_COMMIT_TAG does not match Cargo.toml $number" >&2
        exit 1
      fi
      echo "NUMBER=$number" >> version.env
  artifacts:
    reports:
      # Downstream jobs read this as $NUMBER, the way they read the job output on GitHub.
      dotenv: version.env

# Native Windows builds on the shell runner, so the variables are read as $env:NAME.
build:windows:
  extends: .release_rules
  stage: build
  tags: [windows]
  needs: [version]
  cache: []
  parallel:
    matrix:
      - TARGET: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
  script:
    - rustup target add $env:TARGET
    - cargo build --release --locked --target $env:TARGET
    - $name = "baka-$env:NUMBER-$env:TARGET"
    - New-Item -ItemType Directory $name | Out-Null
    - Copy-Item "target/$env:TARGET/release/baka.exe", README.md, LICENSE $name
    # Flat at the archive root, which is what the binstall bin-dir in Cargo.toml expects.
    - Compress-Archive -Path "$name/*" -DestinationPath "$name.zip" -Force
  artifacts:
    paths:
      - baka-*.zip

# Linux is what makes `cargo binstall` mean anything off Windows, and it is the same
# archive shape so one bin-dir covers both. Built against the glibc in rust:latest, so
# a distro older than that still wants `cargo install` or the AUR package.
build:linux:
  extends: .release_rules
  stage: build
  image: rust:latest
  needs: [version]
  cache: []
  script:
    - |
      set -eu
      target=x86_64-unknown-linux-gnu
      rustup target add "$target"
      cargo build --release --locked --target "$target"
      name="baka-$NUMBER-$target"
      mkdir "$name"
      cp "target/$target/release/baka" README.md LICENSE "$name/"
      tar -czf "$name.tar.gz" -C "$name" baka README.md LICENSE
  artifacts:
    paths:
      - baka-*.tar.gz

release:
  extends: .release_rules
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - version
    - build:windows
    - build:linux
  cache: []
  script:
    - |
      set -eu
      # The release-cli image is Alpine and ships no curl, only busybox wget, which
      # cannot send an upload with a header.
      apk add --no-cache curl
      mkdir -p archives && mv baka-*.zip baka-*.tar.gz archives/
      cd archives
      # Not `*`: tee creates SHA256SUMS.txt while the glob may still be expanding, and
      # the file then lists its own empty hash, so `sha256sum -c` always fails once.
      sha256sum baka-* | tee SHA256SUMS.txt
      # Matched on the full target triple: plain x86_64 now also matches the Linux
      # tarball, and Scoop would be handed the wrong checksum.
      echo "X64=$(awk '/x86_64-pc-windows-msvc/ { print $1 }' SHA256SUMS.txt)"    >> ../sums.env
      echo "ARM64=$(awk '/aarch64-pc-windows-msvc/ { print $1 }' SHA256SUMS.txt)" >> ../sums.env
      # GitLab releases carry links, not blobs, so the archives go to the project's
      # generic package registry first and the release points at them there.
      for f in *; do
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/baka/$CI_COMMIT_TAG/$f"
      done
  artifacts:
    reports:
      dotenv: sums.env
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    # `--generate-notes` has no GitLab equivalent; the tag message is used instead.
    description: $CI_COMMIT_TAG
    assets:
      # `filepath` is what puts an asset under /-/releases/<tag>/downloads/<name>. Without
      # it the only address an asset has is the package registry API URL, and every
      # install route here (Scoop, binstall, anyone reading the README) is written
      # against the permalink.
      links:
        - name: baka-$NUMBER-x86_64-pc-windows-msvc.zip
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/baka/$CI_COMMIT_TAG/baka-$NUMBER-x86_64-pc-windows-msvc.zip
          filepath: /baka-$NUMBER-x86_64-pc-windows-msvc.zip
        - name: baka-$NUMBER-aarch64-pc-windows-msvc.zip
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/baka/$CI_COMMIT_TAG/baka-$NUMBER-aarch64-pc-windows-msvc.zip
          filepath: /baka-$NUMBER-aarch64-pc-windows-msvc.zip
        - name: baka-$NUMBER-x86_64-unknown-linux-gnu.tar.gz
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/baka/$CI_COMMIT_TAG/baka-$NUMBER-x86_64-unknown-linux-gnu.tar.gz
          filepath: /baka-$NUMBER-x86_64-unknown-linux-gnu.tar.gz
        - name: SHA256SUMS.txt
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/baka/$CI_COMMIT_TAG/SHA256SUMS.txt
          filepath: /SHA256SUMS.txt

# crates.io needs no Windows runner, so unlike the rest of the release chain this
# one runs by itself on a tag. Self-skips when CARGO_REGISTRY_TOKEN is unset,
# matching the `if: env.TOKEN != ''` guard on GitHub.
crates:
  extends: .release_rules
  stage: publish
  image: rust:latest
  needs: [version]
  script:
    - |
      if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
        echo "CARGO_REGISTRY_TOKEN is not set, skipping the crates.io publish."
        exit 0
      fi
      cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"

# The Scoop bucket lives in this repo, so the manifest is committed back to the
# default branch. Needs a token that may push: set BAKA_BUCKET_TOKEN to a project
# access token with `write_repository`. Unset = skipped, so the release stays green.
scoop:
  extends: .release_rules
  stage: publish
  image: alpine:3.20
  needs:
    - version
    - release
  cache: []
  script:
    - |
      set -eu
      if [ -z "${BAKA_BUCKET_TOKEN:-}" ]; then
        echo "BAKA_BUCKET_TOKEN is not set, skipping the Scoop bucket update."
        exit 0
      fi
      apk add --no-cache git bash
      # SKIP for the crate checksum: nothing here reads the PKGBUILD this also renders.
      bash scripts/manifests.sh "$NUMBER" "$X64" "$ARM64" SKIP rendered
      echo "Point the bucket at the new release"
      # A tag pipeline checks out the tag in detached HEAD. The bucket belongs on the
      # default branch, and committing on top of the tag pushes fine only while the tag
      # is still that branch's tip, which is a release that fails for no visible reason.
      git fetch --depth 1 origin "$CI_DEFAULT_BRANCH"
      git checkout -B "$CI_DEFAULT_BRANCH" FETCH_HEAD
      mkdir -p bucket
      mv rendered/baka.json bucket/baka.json
      git config user.name "gitlab-ci"
      git config user.email "gitlab-ci@$CI_SERVER_HOST"
      git add bucket/baka.json
      git diff --cached --quiet || git commit -m "Scoop manifest for $CI_COMMIT_TAG"
      git push "https://oauth2:${BAKA_BUCKET_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"

# The AUR package builds from the crates.io tarball rather than from a binary, so it
# needs `crates` to have run and the file to have reached the CDN. Set AUR_SSH_KEY to a
# private key whose public half is on an AUR account that co-maintains b-baka. Unset =
# skipped. The first push has to be to an already reserved package name; AUR creates the
# repository on submission, it does not create the name.
aur:
  extends: .release_rules
  stage: publish
  image: archlinux:base-devel
  needs:
    - version
    - crates
  cache: []
  script:
    - |
      set -eu
      if [ -z "${AUR_SSH_KEY:-}" ]; then
        echo "AUR_SSH_KEY is not set, skipping the AUR update."
        exit 0
      fi
      pacman -Syu --noconfirm --needed git openssh

      echo "Wait for b-baka $NUMBER on the crates.io CDN"
      url="https://static.crates.io/crates/b-baka/b-baka-$NUMBER.crate"
      for _ in $(seq 30); do
        if curl --fail --silent --location --output crate.tar.gz "$url"; then break; fi
        sleep 10
      done
      if ! test -s crate.tar.gz; then
        echo "b-baka $NUMBER never reached the crates.io CDN" >&2
        exit 1
      fi
      sum=$(sha256sum crate.tar.gz | cut -d' ' -f1)

      # SKIP twice: the PKGBUILD carries no archive checksums, so this job has no reason
      # to wait on the release stage for them.
      bash scripts/manifests.sh "$NUMBER" SKIP SKIP "$sum" rendered

      echo "Generate .SRCINFO, which makepkg refuses to do as root"
      useradd --create-home builder
      install -d -o builder -g builder /tmp/aur
      install -o builder -g builder rendered/aur/PKGBUILD /tmp/aur/PKGBUILD
      su builder -c 'cd /tmp/aur && makepkg --printsrcinfo > .SRCINFO'

      # AUR_SSH_KEY is a File variable, so this is a path. GitLab cannot mask a multi
      # line variable, and a private key pasted into a normal one is a key in plain text
      # in every job log that ever echoes it.
      install -d -m 0700 "$HOME/.ssh"
      install -m 0600 "$AUR_SSH_KEY" "$HOME/.ssh/aur"
      ssh-keyscan aur.archlinux.org >> "$HOME/.ssh/known_hosts" 2>/dev/null
      export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"

      git clone ssh://aur@aur.archlinux.org/b-baka.git /tmp/pkg
      cp /tmp/aur/PKGBUILD /tmp/aur/.SRCINFO /tmp/pkg/
      cd /tmp/pkg
      git config user.name "gitlab-ci"
      git config user.email "gitlab-ci@$CI_SERVER_HOST"
      git add PKGBUILD .SRCINFO
      git diff --cached --quiet || git commit -m "b-baka $NUMBER"
      git push origin HEAD:master

# The image is built from the Dockerfile at the root, so `docker build .` on a clean
# checkout produces the same thing. Both tags are pushed: the version for anyone pinning,
# and latest for anyone not. Pushing needs no secret, the job token is the credential.
#
# This uses dind on the `docker` runner. If that runner is ever unprivileged, move the
# job to `tags: [crimsonrunner]` and drop the services and DOCKER_* variables: that
# runner has a host daemon already.
container:
  extends: .release_rules
  stage: publish
  image: docker:27-cli
  services:
    - docker:27-dind
  needs: [version]
  cache: []
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - |
      set -eu
      docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
      docker build \
        --tag "$CI_REGISTRY_IMAGE:$NUMBER" \
        --tag "$CI_REGISTRY_IMAGE:latest" \
        .
      docker push "$CI_REGISTRY_IMAGE:$NUMBER"
      docker push "$CI_REGISTRY_IMAGE:latest"
