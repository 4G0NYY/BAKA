[package]
name = "baka"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "BitTorrent Acquisition & Keyword Aggregator, a terminal torrent search and download tool"
repository = "https://github.com/4G0NYY/BAKA"
license = "MIT"
readme = "README.md"
keywords = ["torrent", "bittorrent", "tui", "cli", "search"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"

# Phase 6 ships this binary through winget and Scoop, where download size is the
# first thing a user notices.
[profile.release]
lto = true
codegen-units = 1
strip = true
